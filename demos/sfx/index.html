<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>DEMON SFX</title>
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <main class="shell">
      <header class="top">
        <div class="title">sfx <small>Stable Audio 3 small-sfx</small></div>
        <div class="transport">
          <label class="field">
            <span>Bank</span>
            <select id="bank"></select>
          </label>
          <label class="field">
            <span>Length s</span>
            <input id="duration" type="number" min="1" max="60" step="1">
          </label>
          <button id="transport" type="button" class="power">Start</button>
          <span class="readout"><b>tick</b> <span id="tick">--.-</span> ms</span>
          <span id="status-dot" class="dot dot-idle" aria-hidden="true"></span>
          <span id="status-text" class="status">idle</span>
        </div>
      </header>

      <canvas id="scope" class="scope" width="1200" height="180" aria-label="Loop waveform and playhead"></canvas>

      <section id="pads" class="pads" aria-label="Sound pads"></section>

      <section class="row">
        <label class="field grow">
          <span>Prompt (edit the active pad, Enter to send)</span>
          <input id="prompt" type="text" spellcheck="false">
        </label>
        <button id="reroll" type="button" disabled>Re-roll seed</button>
        <button id="save" type="button" disabled>Save WAV</button>
      </section>

      <section class="row">
        <label class="field grow">
          <span>Morph to <em id="morph-target">(shift-click a pad)</em> <em id="morph-value">0.00</em></span>
          <input id="morph" type="range" min="0" max="1" step="0.01" value="0" disabled>
        </label>
      </section>

      <section id="knobs" class="knobs" aria-label="Model knobs"></section>
    </main>
    <script type="module" src="./sfx.js"></script>
  </body>
</html>
