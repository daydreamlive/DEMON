<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>DEMON MRT2</title>
    <link rel="stylesheet" href="./styles.css">
    <script type="importmap">
      { "imports": { "three": "https://esm.sh/three@0.183.1" } }
    </script>
  </head>
  <body>
    <canvas id="scene"></canvas>
    <div id="status" class="status">idle</div>
    <section class="panel" aria-label="Magenta RealTime 2 controls">
      <label>Prompt A <input id="prompt-a" type="text"></label>
      <label>Prompt B <input id="prompt-b" type="text"></label>
      <label>A/B blend <span id="blend-value">0.00</span>
        <input id="blend" type="range" min="0" max="1" step="0.01" value="0">
      </label>
      <div id="knobs" class="knobs"></div>
      <div class="buttons">
        <button id="start" type="button">Start</button>
        <button id="send" type="button" disabled>Send</button>
      </div>
    </section>
    <script type="module" src="./mrt2.js"></script>
  </body>
</html>
