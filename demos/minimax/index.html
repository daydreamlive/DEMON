<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>DEMON MiniMax</title>
    <link rel="stylesheet" href="./styles.css">
    <script type="importmap">
      { "imports": { "three": "https://esm.sh/three@0.183.1" } }
    </script>
  </head>
  <body>
    <canvas id="scene"></canvas>
    <div id="status" class="status">idle</div>

    <section class="panel" aria-label="MiniMax-Music3 controls">
      <label>Style prompt
        <textarea id="prompt" rows="3"></textarea>
      </label>
      <div class="row">
        <button id="start" type="button">Start</button>
        <button id="send" type="button" disabled>Send prompt</button>
      </div>
      <label>Lyrics (applied on Reconnect)
        <textarea id="lyrics" rows="3" placeholder="[instrumental]"></textarea>
      </label>
      <label>Duration s (applied on Reconnect)
        <input id="duration" type="number" min="30" max="360" placeholder="60">
      </label>
      <button id="reconnect" type="button" disabled>Reconnect</button>
      <div id="knobs" class="knobs"></div>
    </section>

    <script type="module" src="./minimax.js"></script>
  </body>
</html>
